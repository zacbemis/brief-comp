name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug, ASan/UBSan
            compiler: gcc
            build: Debug
            sanitizers: "ON"
          - name: Clang Debug, ASan/UBSan
            compiler: clang
            build: Debug
            sanitizers: "ON"
          - name: GCC Release
            compiler: gcc
            build: Release
            sanitizers: "ON"
          - name: GCC Debug, no sanitizers
            compiler: gcc
            build: Debug
            sanitizers: "OFF"
    env:
      # CMake builds the compiler with CC, and brief compiles the programs it
      # generates with CC, so each job also exercises that compiler's output.
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep ASan's shadow memory mappable
        # High mmap randomization on newer kernels can break ASan start-up.
        if: matrix.sanitizers == 'ON' && matrix.build == 'Debug'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DBRIEF_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned clang-format
        # Formatting output changes between releases; keep this version in
        # step with the one used locally.
        run: pip install clang-format==23.1.3
      - name: Check formatting
        run: git ls-files -z '*.c' '*.h' | xargs -0 clang-format --dry-run --Werror
